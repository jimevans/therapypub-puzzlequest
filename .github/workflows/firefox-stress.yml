# TEMPORARY, to be removed before merging: hunts Firefox's intermittent
# "no request payload was received" timeout with the service worker on.
name: Firefox stress

on:
  pull_request:

permissions:
  contents: read

jobs:
  stress:
    name: Firefox stress (log level ${{ matrix.level }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        level: [trace]
    env:
      E2E_BROWSER: firefox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --engine-strict
      - run: npm run build
      - name: Repeat the suspected trigger
        timeout-minutes: 8
        working-directory: e2e
        env:
          STRESS_ITERATIONS: 1000
          STRESS_EVENT_LOG: ${{ runner.temp }}/logs/events.jsonl
          STRESS_NO_WORKER: true
        run: mkdir -p "$RUNNER_TEMP/logs" && npx wdio run stress/wdio.no-worker.conf.ts --spec stress/navigation.e2e.ts --logLevel ${{ matrix.level }} --outputDir "$RUNNER_TEMP/logs/targeted"
      - name: Repeat the whole Firefox suite
        if: false
        timeout-minutes: 15
        working-directory: e2e
        run: |
          for pass in $(seq 1 15); do
            echo "=== pass $pass"
            npx wdio run wdio.conf.ts --logLevel ${{ matrix.level }} --outputDir "$RUNNER_TEMP/logs/suite-$pass" || exit 1
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: firefox-stress-${{ matrix.level }}
          path: ${{ runner.temp }}/logs
          retention-days: 7

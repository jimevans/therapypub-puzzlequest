name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # --engine-strict fails the install if any dependency drops support for
      # the Node version in .nvmrc, which is what the production host runs.
      - run: npm ci --engine-strict
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run format:check
      - run: npm run test:coverage

  browser-tests:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --engine-strict
      # WebdriverIO over WebDriver BiDi, in the runner's Chrome and Firefox.
      - run: npm run test:e2e

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Production dependencies are what the server runs, so an advisory in
      # one fails the build.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      # Advisories in development tools (linters, test runners) are reported
      # but don't block merges; Dependabot raises alerts for them as well.
      - name: Audit all dependencies (report only)
        run: npm audit --audit-level=moderate
        continue-on-error: true

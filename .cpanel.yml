---
# Run by cPanel's Git Version Control on "Deploy HEAD Commit". Each task runs
# in order, in one shell, on the server; a failing task stops the deployment.
deployment:
  tasks:
    - export DEPLOYPATH=/home/thepuzzlequest/puzzlequest
    - export NODE_ENVIRONMENT=/home/thepuzzlequest/nodevenv/puzzlequest/24/bin/activate
    # Copy the checked-out files, leaving out .git: its object files are
    # read-only, so copying it over the previous deployment's copy fails.
    # Files that aren't in the repository (src/.env, uploaded puzzle media,
    # node_modules) are left as they are.
    - cp -R $(ls -A | grep -v -x -F .git) $DEPLOYPATH
    # Build in the application's Node 24 environment (the command shown on
    # cPanel's Setup Node.js App page). The build needs the development
    # dependencies, which are removed again afterwards.
    - source $NODE_ENVIRONMENT && cd $DEPLOYPATH && npm ci && npm run build && npm prune --omit=dev
    # Passenger restarts the application on its next request when this file
    # changes.
    - mkdir -p $DEPLOYPATH/tmp && touch $DEPLOYPATH/tmp/restart.txt

---
# Run by cPanel's Git Version Control on "Deploy HEAD Commit". Each task runs
# in order, in one shell, on the server; a failing task stops the deployment.
#
# The application's packages live in its cPanel Node.js environment, as
# cPanel's "Run NPM Install" button installs them, and node_modules in the
# application directory is a link to them.
deployment:
  tasks:
    - export DEPLOYPATH=/home/thepuzzlequest/puzzlequest
    # The application's Node 24 environment (shown on cPanel's Setup Node.js
    # App page), and the folder in it that holds the application's packages.
    - export NODE_ENVIRONMENT=/home/thepuzzlequest/nodevenv/puzzlequest/24
    - export PACKAGES=$NODE_ENVIRONMENT/lib
    # Copy the checked-out files, leaving out .git (its object files are
    # read-only, so copying it over the previous deployment's copy fails) and
    # the workspaces, which the next task synchronizes. Files that aren't in
    # the repository, such as node_modules, logs, and storage, are left as they
    # are.
    - cp -R $(ls -A | grep -v -x -F -e .git -e apps -e e2e -e packages) $DEPLOYPATH
    # Make the deployed workspaces match the repository's, deleting files the
    # repository no longer has: the build compiles everything in src, so a
    # deleted source file left behind would still be compiled. The web app's
    # built files stay until a new build replaces them, so a failed build
    # leaves the previous ones serving.
    - rsync -a --delete --exclude=/apps/web/dist apps e2e packages $DEPLOYPATH/
    # Record the commit deployed, since the copy has no .git: the server logs
    # it on starting, and a backup records it, so its data's shape is known.
    - git rev-parse HEAD > $DEPLOYPATH/DEPLOYED_COMMIT
    # Install exactly what the deployed package-lock.json lists. Both files are
    # linked into the environment on every deployment, so a new host can deploy
    # without first using cPanel's "Run NPM Install" button (cPanel itself
    # links only package.json). The workspaces are linked beside them, because
    # npm looks for them next to package.json and, if they aren't there, quietly
    # installs without them. The build needs the development dependencies;
    # --include=dev is needed because the environment sets NODE_ENV=production,
    # which makes npm skip them.
    - ln -sf $DEPLOYPATH/package.json $PACKAGES/package.json
    - ln -sf $DEPLOYPATH/package-lock.json $PACKAGES/package-lock.json
    - ln -sfn $DEPLOYPATH/apps $PACKAGES/apps
    - ln -sfn $DEPLOYPATH/e2e $PACKAGES/e2e
    - ln -sfn $DEPLOYPATH/packages $PACKAGES/packages
    - source $NODE_ENVIRONMENT/bin/activate && cd $PACKAGES && npm ci --include=dev
    # Make node_modules in the application directory a link to the packages,
    # replacing anything else that's there.
    - rm -rf $DEPLOYPATH/node_modules && ln -s $PACKAGES/node_modules $DEPLOYPATH/node_modules
    # Compile the server and build the web app, each to its own dist/, then
    # remove the build and test tools.
    #
    # The build runs on two CPUs. Allowed all 16 of this shared host's CPUs, the
    # web app's bundler crashes starting its threads ("Resource temporarily
    # unavailable"), even though `ulimit -u` reports no limit, so whatever refuses
    # them is something the host applies separately. It refuses memory the same
    # way: with two versions of rolldown installed, the build loads two native
    # bundlers, and crashes ("Committing semi space failed") with a heap of
    # only a few megabytes. CI's "One rolldown" step keeps it to one.
    - source $NODE_ENVIRONMENT/bin/activate && cd $DEPLOYPATH && taskset -c 0,1 npm run build
    - source $NODE_ENVIRONMENT/bin/activate && cd $PACKAGES && npm prune --omit=dev
    # Passenger restarts the application on its next request when this file
    # changes.
    - mkdir -p $DEPLOYPATH/tmp && touch $DEPLOYPATH/tmp/restart.txt
